name: NeuroScope quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Python and JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests (SDK hardware mocked)
        run: python -m scripts.run_tests
      - name: Python syntax
        run: python -m compileall -q .
      - name: Browser script syntax
        run: |
          node --check static/lab.js
          node --check static/live.js
          node --check static/studio.js
          node --check static/experiment_lab.js
          node --check static/experiment_runner.js
          node --check static/checkpoints.js
          node --check static/brain_map.js
          node --check static/paired_panel.js
          node --check static/common.js
      - name: Install Chromium for workspace checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium --only-shell
      - name: Check the desktop and mobile workspace
        env:
          RECORDS_DIR: ${{ runner.temp }}/neuroscope-smoke/records
        run: |
          mkdir -p "$RECORDS_DIR/session_synthetic"
          echo '{"started_at":"2026-01-02T09:00:00Z","device":"Synthetic headband"}' > "$RECORDS_DIR/session_synthetic/meta.json"
          python -m uvicorn server:app --host 127.0.0.1 --port 8765 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/ -o /dev/null
          python -m scripts.smoke_workspace http://127.0.0.1:8765 "$RUNNER_TEMP/neuroscope-smoke/screenshots"
      - name: Save workspace screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-workspace
          path: ${{ runner.temp }}/neuroscope-smoke/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
