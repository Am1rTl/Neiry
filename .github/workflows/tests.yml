name: NeuroScope quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Python and JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests (SDK hardware mocked)
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Python syntax
        run: python -m compileall -q .
      - name: Browser script syntax
        run: |
          node --check static/lab.js
          node --check static/live.js
          node --check static/studio.js
