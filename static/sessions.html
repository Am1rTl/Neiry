<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🗂 NEIRY · Sessions</title>
<link rel="stylesheet" href="/static/common.css" />
<script src="/static/common.js"></script>
<style>
/* Специфика страницы сессий: таблицы, формы, health-панель. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(ellipse at 20% 0%, rgba(0, 240, 255, 0.06), transparent 50%),
              radial-gradient(ellipse at 80% 100%, rgba(255, 43, 214, 0.06), transparent 50%);
}
main { position: relative; z-index: 2; padding: 20px 28px 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
.panel {
  background: linear-gradient(180deg, var(--panel) 0%, var(--bg2) 100%);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  opacity: 0.5;
}
.panel.wide { grid-column: 1 / -1; }
.panel h3 {
  margin: 0 0 12px;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h3 .accent { width: 4px; height: 14px; background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
table.rec { width: 100%; border-collapse: collapse; font-size: 12px; }
table.rec th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 6px 8px;
  border-bottom: 1px solid var(--panel-border);
}
table.rec td { padding: 8px; border-bottom: 1px solid rgba(26, 37, 80, 0.4); vertical-align: top; }
table.rec tr:hover td { background: rgba(0, 240, 255, 0.03); }
.badge {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 3px;
  border: 1px solid var(--panel-border);
  color: var(--text-dim);
}
.badge.active { border-color: var(--bad); color: var(--bad); box-shadow: 0 0 8px rgba(255, 51, 85, 0.3); }
.badge.ok { border-color: var(--good); color: var(--good); }
.badge.err { border-color: var(--bad); color: var(--bad); }
.btn {
  display: inline-block;
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 6px 12px;
  margin: 2px 4px 2px 0;
  background: transparent;
  color: var(--neon-cyan);
  border: 1px solid var(--neon-cyan);
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: rgba(0, 240, 255, 0.12); box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
.btn.danger { color: var(--neon-pink); border-color: var(--neon-pink); }
.btn.danger:hover { background: rgba(255, 62, 127, 0.12); box-shadow: 0 0 10px rgba(255, 62, 127, 0.4); }
.btn.dim { color: var(--text-dim); border-color: var(--panel-border); }
.btn.dim:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); background: none; box-shadow: none; }
.btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
pre.dump {
  font-size: 11px;
  line-height: 1.5;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 10px 12px;
  overflow: auto;
  max-height: 320px;
  margin: 8px 0 0;
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; margin-bottom: 8px; }
.kv .k { color: var(--text-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; padding-top: 2px; }
.row-form { display: flex; gap: 8px; margin-top: 8px; }
.row-form input {
  flex: 1;
  font-family: inherit;
  font-size: 12px;
  color: var(--text);
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  padding: 8px 10px;
}
.row-form input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); }
.msg { font-size: 11px; margin-top: 8px; min-height: 16px; }
.msg.ok { color: var(--good); }
.msg.err { color: var(--bad); }
.empty { color: var(--text-dim); font-size: 12px; padding: 12px 0; }
.summary { font-size: 11px; color: var(--text-dim); }
</style>
</head>
<body>

<header class="cap-header" style="padding:14px 24px;">
  <div class="cap-logo" style="font-size:18px;">NEIRY · SESSIONS</div>
  <a href="/" class="nav-link dim" data-i18n="navDashboard">◈ ДАШБОРД</a>
  <a href="/charts" class="nav-link dim" data-i18n="navCharts">📈 ГРАФИКИ →</a>
  <a href="/more" class="nav-link dim" data-i18n="navMore"> ЕЩЁ </a>
  <span class="chip idle" id="chip-status"><span class="dot"></span><span id="status-text">idle</span></span>
  <span class="chip" id="chip-stale" title="Возраст данных (t_server в тике)"><span class="dot"></span><span class="stale-val">—</span></span>
  <div style="margin-left:auto; display:flex; gap:12px; align-items:center;">
    <button id="lang-toggle" class="chip">RU</button>
  </div>
</header>

<main>
  <section class="panel wide">
    <h3><span class="accent"></span><span data-i18n="sesTitle">Записанные сессии</span></h3>
    <div style="margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button class="btn dim" id="btn-refresh">↻ <span data-i18n="sesRefresh">обновить</span></button>
      <span class="summary" id="records-dir"></span>
    </div>
    <div id="records-body"><div class="empty" data-i18n="sesLoading">Загрузка…</div></div>
  </section>

  <section class="panel">
    <h3><span class="accent"></span><span data-i18n="sesHealth">Состояние сервера</span></h3>
    <div style="margin-bottom:10px;">
      <span class="badge" id="health-badge">—</span>
      <button class="btn dim" id="btn-health">↻ <span data-i18n="sesRefresh">обновить</span></button>
    </div>
    <div class="kv" id="health-kv"></div>
    <pre class="dump" id="health-dump">—</pre>
  </section>

  <section class="panel">
    <h3><span class="accent"></span><span data-i18n="sesMarker">Маркер в запись</span></h3>
    <div class="summary" data-i18n="sesMarkerHint">Маркер попадёт в активную запись сессии (и в WS-поток).</div>
    <div class="row-form">
      <input id="marker-input" maxlength="120" data-i18n-ph="sesMarkerPh" placeholder="Название маркера" />
      <button class="btn" id="btn-marker-send" data-i18n="sesSend">отправить</button>
    </div>
    <div class="msg" id="marker-msg"></div>
  </section>
</main>

<script>
// Страница сессий: REST (records/health/markers) + WS только для
// чипа статуса и stale-индикатора. Эндпоинты download/delete/markers/health
// добавляет бэкенд; отсутствующие показываем текстом ошибки, а не падением.
const lang = Capsule.createLang({
  en: {
    sesTitle: "Recorded sessions", sesRefresh: "refresh", sesLoading: "Loading…",
    sesEmpty: "No sessions yet.",
    sesColId: "session", sesColState: "state", sesColInfo: "info", sesColActions: "actions",
    sesActive: "● REC", sesClosed: "closed",
    sesDownload: "⬇ download", sesDelete: "✕ delete",
    sesConfirmDelete: (id) => `Delete session ${id}?`,
    sesDeleted: "deleted", sesDeleteErr: "delete failed",
    sesHealth: "Server health",
    sesMarker: "Marker into recording",
    sesMarkerHint: "The marker goes into the active session recording (and the WS stream).",
    sesMarkerPh: "Marker label", sesSend: "send",
    sesMarkerEmpty: "enter a label first", sesMarkerOk: "marker sent", sesMarkerErr: "send failed",
    sesLoadErr: "load failed",
    sesHealthOk: "OK", sesHealthErr: "ERROR",
  },
  ru: {
    sesTitle: "Записанные сессии", sesRefresh: "обновить", sesLoading: "Загрузка…",
    sesEmpty: "Сессий пока нет.",
    sesColId: "сессия", sesColState: "статус", sesColInfo: "инфо", sesColActions: "действия",
    sesActive: "● REC", sesClosed: "закрыта",
    sesDownload: "⬇ скачать", sesDelete: "✕ удалить",
    sesConfirmDelete: (id) => `Удалить сессию ${id}?`,
    sesDeleted: "удалено", sesDeleteErr: "не удалось удалить",
    sesHealth: "Состояние сервера",
    sesMarker: "Маркер в запись",
    sesMarkerHint: "Маркер попадёт в активную запись сессии (и в WS-поток).",
    sesMarkerPh: "Название маркера", sesSend: "отправить",
    sesMarkerEmpty: "сначала введите название", sesMarkerOk: "маркер отправлен", sesMarkerErr: "не удалось отправить",
    sesLoadErr: "не удалось загрузить",
    sesHealthOk: "OK", sesHealthErr: "ОШИБКА",
  },
});
function t(key) { return lang.t(key); }
lang.apply();
lang.bindToggle(() => { loadRecords(); loadHealth(); });
const stale = Capsule.stale('chip-stale', t);

// Плейсхолдеры не покрываются data-i18n — применяем отдельно.
function applyPlaceholders() {
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = t(el.dataset.i18nPh);
    if (typeof v === 'string') el.placeholder = v;
  });
}
applyPlaceholders();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function setStatus(s) {
  document.getElementById('chip-status').className = 'chip ' + s;
  document.getElementById('status-text').textContent = t('status_' + s) ?? s;
}

// Лёгкий WS: только статус и свежесть данных.
Capsule.connectWS('/ws', {
  onStatus: setStatus,
  onTick: (d) => { stale.update(d.t_server); },
});

// --- Список записей: GET /api/records ---
async function loadRecords() {
  const body = document.getElementById('records-body');
  try {
    const r = await fetch('/api/records');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    document.getElementById('records-dir').textContent = data.records_dir || '';
    const sessions = data.sessions || [];
    if (!sessions.length) {
      body.innerHTML = '<div class="empty">' + esc(t('sesEmpty')) + '</div>';
      return;
    }
    let html = '<table class="rec"><thead><tr><th>' + esc(t('sesColId')) + '</th><th>' +
      esc(t('sesColState')) + '</th><th>' + esc(t('sesColInfo')) + '</th><th>' +
      esc(t('sesColActions')) + '</th></tr></thead><tbody>';
    for (const s of sessions) {
      const id = s.session_id || '';
      const info = infoFor(s);
      html += '<tr><td><b>' + esc(id) + '</b></td><td>' +
        (s.active ? '<span class="badge active">' + esc(t('sesActive')) + '</span>'
                  : '<span class="badge">' + esc(t('sesClosed')) + '</span>') + '</td>' +
        '<td class="summary">' + info + '</td><td>' +
        '<a class="btn dim" href="/api/records/' + encodeURIComponent(id) + '/download">' +
        esc(t('sesDownload')) + '</a>' +
        (s.active ? '' : '<button class="btn danger" data-del="' + esc(id) + '">' +
          esc(t('sesDelete')) + '</button>') +
        '</td></tr>';
    }
    body.innerHTML = html + '</tbody></table>';
    body.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => deleteRecord(btn.dataset.del, btn));
    });
  } catch (e) {
    body.innerHTML = '<div class="empty">✕ ' + esc(t('sesLoadErr')) + ': ' + esc(e.message || e) + '</div>';
  }
}

// Короткая сводка из summary.json/meta.json, если бэкенд их отдал.
function infoFor(s) {
  const parts = [];
  const sum = s.summary || {};
  if (sum.started_at) parts.push(esc(sum.started_at));
  if (sum.counts) {
    const c = sum.counts;
    const kv = Object.keys(c).slice(0, 6).map(k => k + ': ' + c[k]).join(' · ');
    if (kv) parts.push(esc(kv));
  }
  const meta = s.meta || {};
  if (meta.device) parts.push(esc(meta.device));
  if (meta.note) parts.push(esc(meta.note));
  return parts.join('<br>') || '—';
}

async function deleteRecord(id, btn) {
  if (!confirm(t('sesConfirmDelete')(id))) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/records/' + encodeURIComponent(id), { method: 'DELETE' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    loadRecords();
  } catch (e) {
    alert(t('sesDeleteErr') + ': ' + (e.message || e));
    btn.disabled = false;
  }
}

// --- Health: GET /api/health (обновляется раз в 5 c) ---
async function loadHealth() {
  const badge = document.getElementById('health-badge');
  const kv = document.getElementById('health-kv');
  const dump = document.getElementById('health-dump');
  try {
    const r = await fetch('/api/health');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const h = await r.json();
    const ok = h.status === 'ok' || h.ok === true || r.ok;
    badge.className = 'badge ' + (ok ? 'ok' : 'err');
    badge.textContent = (ok ? t('sesHealthOk') : t('sesHealthErr')) +
      (h.status && h.status !== 'ok' ? ' · ' + h.status : '');
    const skip = new Set(['status', 'ok']);
    kv.innerHTML = Object.keys(h).filter(k => skip.has(k) === false && typeof h[k] !== 'object')
      .slice(0, 12)
      .map(k => '<span class="k">' + esc(k) + '</span><span>' + esc(h[k]) + '</span>').join('');
    dump.textContent = JSON.stringify(h, null, 1).slice(0, 4000);
  } catch (e) {
    badge.className = 'badge err';
    badge.textContent = t('sesHealthErr');
    kv.innerHTML = '';
    dump.textContent = '✕ ' + t('sesLoadErr') + ': ' + (e.message || e);
  }
}

// --- Маркер: POST /api/markers {label} ---
async function sendMarker() {
  const input = document.getElementById('marker-input');
  const msg = document.getElementById('marker-msg');
  const label = (input.value || '').trim();
  if (!label) {
    msg.className = 'msg err';
    msg.textContent = t('sesMarkerEmpty');
    return;
  }
  try {
    const r = await fetch('/api/markers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    msg.className = 'msg ok';
    msg.textContent = '✓ ' + t('sesMarkerOk');
    input.value = '';
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = '✕ ' + t('sesMarkerErr') + ': ' + (e.message || e);
  }
}

document.getElementById('btn-refresh').addEventListener('click', loadRecords);
document.getElementById('btn-health').addEventListener('click', loadHealth);
document.getElementById('btn-marker-send').addEventListener('click', sendMarker);
document.getElementById('marker-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMarker();
});
// Переключение языка должно обновлять и плейсхолдер.
document.getElementById('lang-toggle').addEventListener('click', applyPlaceholders);

loadRecords();
loadHealth();
setInterval(loadHealth, 5000);
setInterval(loadRecords, 15000);
</script>
</body>
</html>
